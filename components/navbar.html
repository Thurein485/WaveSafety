<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WaveSafety</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet" />

    <!-- Navbar CSS -->
    <link rel="stylesheet" href="/css/navbar.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-xl flood-navbar">
      <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand flood-brand" href="index.html">
          <img src="/image/WaveSafety.png" alt="WaveSafety Logo" class="brand-logo" />
          <span class="brand-name">WaveSafety</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav mx-auto align-items-xl-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="flood-risk.html">Flood Risk</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="solutions.html">Solutions</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="preparedness.html">Preparedness Guide</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="updates.html">Latest Updates</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="about.html">About Us</a>
            </li>
          </ul>

          <div class="auth-buttons d-flex flex-column flex-xl-row gap-2">
            <button class="btn btn-signup" type="button" data-bs-toggle="modal" data-bs-target="#signupModal">Sign up</button>

            <button class="btn btn-login" type="button" data-bs-toggle="modal" data-bs-target="#loginModal">Log in</button>
          </div>
        </div>
      </div>
    </nav>

    <!-- SIGN UP MODAL -->
    <div class="modal fade auth-modal" id="signupModal" tabindex="-1" aria-labelledby="signupModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header auth-modal-header">
            <div>
              <span class="modal-icon">
                <i class="bi bi-person-plus-fill"></i>
              </span>

              <h2 class="modal-title" id="signupModalLabel">Create an Account</h2>

              <p>Join us in building safer communities.</p>
            </div>

            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body">
            <form id="signupForm">
              <div class="mb-3">
                <label for="signupName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="signupName" name="name" placeholder="Enter your full name" autocomplete="name" required />
              </div>

              <div class="mb-3">
                <label for="signupEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="signupEmail" name="email" placeholder="you@example.com" autocomplete="email" required />
              </div>

              <div class="mb-3">
                <label for="signupPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="signupPassword" name="password" placeholder="Create a password" minlength="8" autocomplete="new-password" required />
                <small class="form-text">Use at least 8 characters.</small>
              </div>

              <div class="mb-4">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Enter your password again" minlength="8" autocomplete="new-password" required />
                <div id="passwordMessage" class="form-feedback"></div>
              </div>

              <button type="submit" class="btn auth-submit">
                Create Account
                <i class="bi bi-arrow-right ms-2"></i>
              </button>

              <p class="auth-switch">
                Already have an account?
                <button type="button" class="text-button" data-bs-toggle="modal" data-bs-target="#loginModal" data-bs-dismiss="modal">Log in</button>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- LOG IN MODAL -->
    <div class="modal fade auth-modal" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header auth-modal-header">
            <div>
              <span class="modal-icon">
                <i class="bi bi-shield-lock-fill"></i>
              </span>

              <h2 class="modal-title" id="loginModalLabel">Welcome Back</h2>

              <p>Log in to continue to WaveSafety.</p>
            </div>

            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body">
            <form id="loginForm">
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="loginEmail" name="email" placeholder="you@example.com" autocomplete="email" required />
              </div>

              <div class="mb-4">
                <label for="loginPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" name="password" placeholder="Enter your password" autocomplete="current-password" required />
              </div>

              <button type="submit" class="btn auth-submit">
                Log In
                <i class="bi bi-arrow-right ms-2"></i>
              </button>

              <p class="auth-switch">
                Don't have an account?
                <button type="button" class="text-button" data-bs-toggle="modal" data-bs-target="#signupModal" data-bs-dismiss="modal">Sign up</button>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
